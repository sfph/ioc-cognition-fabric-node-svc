name: ioc-CFN CI workflow

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/ci.yaml'
      - 'Dockerfile'
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/ci.yaml'
      - 'Dockerfile'

  workflow_dispatch:

# Grant read access for GITHUB_TOKEN on all jobs
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout
  packages: write # needed to push docker image to gar or ecr

jobs:
  ################################## Code Checkout ##############################
  ###############################################################################
  checkout-unit-tests-build-docs:
    name: checkout & unit test & build docs
    runs-on:
      group: ${{ vars.DEFAULT_ARC_RUNNERS }}
    container:
      image: python:3.11-slim
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The branch, tag or SHA to checkout, otherwise, uses the default branch.
          ref: ${{ github.ref }}
          # Relative path under $GITHUB_WORKSPACE to place the repository
          path: ""
          # Whether to execute `git clean -ffdx && git reset --hard HEAD` before fetching
          # Default: true
          clean: true
          # Whether to download Git-LFS files
          # Default: false
          lfs: ""
          # Whether to checkout submodules: `true` to checkout submodules or `recursive` to
          # recursively checkout submodules.
          # Default: false
          submodules: ""

      ################################## Setup Python & Poetry #######################
      ###############################################################################

      - name: Check Python version
        run: |
          python3 --version || python --version

      - name: Install Poetry
        run: |
          python3 -m pip install --upgrade pip || python -m pip install --upgrade pip
          python3 -m pip install --force-reinstall poetry==2.3.2 || python -m pip --force-reinstall poetry==2.3.2
          poetry --version

      ################################## Install Dependencies #######################
      ###############################################################################

      - name: Setup virtual environment
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local

      - name: Install system dependencies
        run: apt-get update && apt-get install -y make libpq-dev build-essential

      - name: Install Dependencies
        run: |
          make install

      ################################## Linting ####################################
      ###############################################################################

      - name: Run Linting
        run: |
          make lint

      ################################## Unit Test ##################################
      ###############################################################################
      - name: Run Unit Tests
        env:
          DISABLE_REGISTRATION: "true"
        run: |
          make test

      - name: Build docs
        run: |
          make docs

  #################### Docker build & push ######################
  ###############################################################################
  docker-build-push:
    name: Docker Build & Push
    needs: [checkout-unit-tests-build-docs]
    runs-on:
      group: ${{ vars.DEFAULT_ARC_RUNNERS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Git tag (if any)
        id: get_tag
        run: |
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Generate metadata
        id: metadata
        run: |
          echo "date_formatted=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "git_commit_time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          echo "git_branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64, linux/arm64
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.metadata.outputs.date_formatted }}-${{ steps.metadata.outputs.short_sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}:{1}', github.repository, steps.get_tag.outputs.tag_name) || '' }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_COMMIT_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
            GIT_BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ################################## Send Status for PR Checks ###########################
  ########################################################################################
  # This Job is REQUIRED, it is what allows for the WHOLE workflow to show up in the PR status checks as a requirement for branch rules
  reusable-workflow-ci-status:
    name: Reusable Workflow CI Status
    # This should be an array of ALL active jobs that are used/run
    needs: [
        checkout-unit-tests-build-docs,
        docker-build-push,
      ]
    if: always()
    runs-on:
      group: ${{ vars.DEFAULT_ARC_RUNNERS }}
    steps:
      - name: report failure
        if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
        run: |
          echo -e "\033[31m*** WORKFLOW FAILED ***\033[0m"
          exit 1
      - name: report success
        run: |
          echo -e "\033[1;36m*** WORKFLOW SUCCESS ***\033[0m"
          exit 0
