name: ioc-CFN CI workflow

on:
  # Run on any branch push to test changes
  push:
    branches:
      - "**"
    # only build when important files change
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/ci.yaml'
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - "main"

  workflow_dispatch:

# Grant read access for GITHUB_TOKEN on all jobs
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout
  packages: write # needed to push docker image to gar or ecr

jobs:
  ################################## Code Checkout ##############################
  ###############################################################################
  checkout-unit-tests:
    name: checkout & unit test
    runs-on:
      group: ${{ vars.DEFAULT_ARC_RUNNERS }}
    container:
      image: python:3.11-slim
      options: --user root

    steps:
      - name: Import Vault Secrets
        uses: hashicorp/vault-action@e3d5714d59e151ca80233142880b9da9d983a48c # v2.7.5
        with:
          url: ${{ vars.KEEPER_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
          secretId: ${{ secrets.VAULT_APPROLE_SECRET_ID }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          secrets: |
            ${{ vars.VAULT_SECRET_PATH }} ARTIFACTORY_USER | ARTIFACTORY_USER ;
            ${{ vars.VAULT_SECRET_PATH }} ARTIFACTORY_DEVHUB_PYTHON_TOKEN | ARTIFACTORY_DEVHUB_PYTHON_TOKEN ;

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The branch, tag or SHA to checkout, otherwise, uses the default branch.
          ref: ${{ github.ref }}
          # Relative path under $GITHUB_WORKSPACE to place the repository
          path: ""
          # Whether to execute `git clean -ffdx && git reset --hard HEAD` before fetching
          # Default: true
          clean: true
          # Whether to download Git-LFS files
          # Default: false
          lfs: ""
          # Whether to checkout submodules: `true` to checkout submodules or `recursive` to
          # recursively checkout submodules.
          # Default: false
          submodules: ""

      ################################## Setup Python & Poetry #######################
      ###############################################################################

      - name: Check Python version
        run: |
          python3 --version || python --version

      - name: Install Poetry
        run: |
          python3 -m pip install --upgrade pip || python -m pip install --upgrade pip
          python3 -m pip install poetry || python -m pip install poetry
          poetry --version

      ################################## Install Dependencies #######################
      ###############################################################################

      - name: Setup virtual environment
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local

      - name: Configure Artifactory credentials
        run: |
          poetry config http-basic.outshift-pypi ${{ env.ARTIFACTORY_USER }} ${{ env.ARTIFACTORY_DEVHUB_PYTHON_TOKEN }}

      - name: Install system dependencies
        run: apt-get update && apt-get install -y make libpq-dev build-essential

      - name: Install Dependencies
        run: |
          make install

      ################################## Linting ####################################
      ###############################################################################

      - name: Run Linting
        run: |
          make lint

      ################################## Unit Test ##################################
      ###############################################################################
      - name: Run Unit Tests
        env:
          DISABLE_REGISTRATION: "true"
        run: |
          make test

  #################### Docker build & push ######################
  ###############################################################################
  docker-build-push:
    name: Docker Build & Push
    needs: [checkout-unit-tests]
    runs-on:
      group: ${{ vars.DEFAULT_ARC_RUNNERS }}

    steps:
      - name: Import Vault Secrets
        uses: hashicorp/vault-action@e3d5714d59e151ca80233142880b9da9d983a48c # v2.7.5
        with:
          url: ${{ vars.KEEPER_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
          secretId: ${{ secrets.VAULT_APPROLE_SECRET_ID }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          secrets: |
            ${{ vars.VAULT_SECRET_PATH }} ARTIFACTORY_USER | ARTIFACTORY_USER ;
            ${{ vars.VAULT_SECRET_PATH }} ARTIFACTORY_DEVHUB_PYTHON_TOKEN | ARTIFACTORY_DEVHUB_PYTHON_TOKEN ;

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.GHCR_REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ vars.GHCR_REGISTRY }}/${{ github.event.repository.name }}:${{ github.sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_COMMIT_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
            GIT_BRANCH=${{ github.head_ref || github.ref_name }}
            ARTIFACTORY_USER=${{ env.ARTIFACTORY_USER }}
            ARTIFACTORY_TOKEN=${{ env.ARTIFACTORY_DEVHUB_PYTHON_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ################################## Send Status for PR Checks ###########################
  ########################################################################################
  # This Job is REQUIRED, it is what allows for the WHOLE workflow to show up in the PR status checks as a requirement for branch rules
  reusable-workflow-ci-status:
    name: Reusable Workflow CI Status
    # This should be an array of ALL active jobs that are used/run
    needs: [
        checkout-unit-tests,
        docker-build-push,
      ]
    if: always()
    runs-on:
      group: ${{ vars.DEFAULT_ARC_RUNNERS }}
    steps:
      - name: report failure
        if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
        run: |
          echo -e "\033[31m*** WORKFLOW FAILED ***\033[0m"
          exit 1
      - name: report success
        run: |
          echo -e "\033[1;36m*** WORKFLOW SUCCESS ***\033[0m"
          exit 0