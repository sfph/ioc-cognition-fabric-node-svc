[project]
name = "ioc-cognition-fabric-node-svc"
version = "0.0.1"
description = "IOC CFN"
authors = [
    {name = "Darren Lau",email = "darrelau@cisco.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "uvicorn (>=0.24.0,<0.42.0)",
    "fastapi (>=0.104.1,<0.136.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "httpx>=0.27",
    "knowledge-memory==0.1.5.dev20260318010930",
    "cognition-engine (>=0.1.0.dev3,<0.2.0)"
]

[[tool.poetry.source]]
name = "outshift-pypi"
url = "https://artifactory.devhub-cloud.cisco.com/artifactory/api/pypi/outshift-pypi/simple"
priority = "supplemental"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.1"
black = "^24.0"
flake8 = "^7.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
