[project]
name = "ioc-cognition-fabric-node-svc"
version = "0.0.1"
description = "IOC CFN"
authors = [
    {name = "Darren Lau",email = "darrelau@cisco.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uvicorn (>=0.41.0,<0.42.0)",
    "fastapi (>=0.135.1,<0.136.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "httpx<0.27"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.1"
black = "^24.0"
flake8 = "^7.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
