[project]
name = "ioc-cognition-fabric-node-svc"
version = "0.1.2"
description = "IOC CFN"
authors = [
    {name = "Outshift by Cisco",email = "outshiftbycisco@cisco.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "uvicorn (>=0.24.0,<0.42.0)",
    "fastapi (>=0.104.1,<0.136.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "httpx>=0.27",
    "ioc-knowledge-memory==0.2.1",
    "ioc-cfn-cognition-engines==0.1.3"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.1"
black = "^26.3.1"
flake8 = "^7.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
